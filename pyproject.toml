[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "diffdesk"
dynamic = ["version"]
description = "Local, file-based review desk for commits made by agents or people"
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
    "src/diffdesk/static/vendor/LICENSES.txt",
    "src/diffdesk/static/vendor/fonts/OFL.txt",
]
requires-python = ">=3.11"
dependencies = []
keywords = ["code review", "git", "diff", "review", "coding agents", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/ysBach/diffdesk"
Issues = "https://github.com/ysBach/diffdesk/issues"
Changelog = "https://github.com/ysBach/diffdesk/blob/main/CHANGELOG.md"

[project.scripts]
diffdesk = "diffdesk.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
path = "src/diffdesk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/diffdesk"]

[tool.hatch.build.targets.sdist]
include = [
    "src/diffdesk",
    "tests",
    "vendor-src/package.json",
    "vendor-src/package-lock.json",
    "vendor-src/build.mjs",
    "vendor-src/OFL.txt",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py311"
extend-exclude = ["src/diffdesk/static", "vendor-src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
